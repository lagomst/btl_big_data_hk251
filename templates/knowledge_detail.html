<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/knowledge_detail.css" />
  <link rel="stylesheet" href="/static/css/chat.css" />
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/knowledge-base">Back to List</a>
    </nav>
  </header>

  <main>
    <!-- Upload -->
    <section id="upload-section">
      <h2>Upload File</h2>
      <form id="uploadForm">
        <input type="file" id="file" name="file" required />
        <label><input type="checkbox" id="use_ocr" /> Use OCR</label>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Upload</button>
      </form>
      <div id="uploadStatus"></div>
    </section>

    <!-- Search -->
    <section id="search-section">
      <h2>Search Files</h2>
      <input id="query" placeholder="Search by prefix or filter..." />
      <button id="searchBtn">Search</button>
    </section>

    <!-- Files Table -->
    <section id="files-section">
      <h2>Files in Knowledge Base</h2>
      <table id="filesTable">
        <thead>
          <tr>
            <th>File Path</th>
            <th>Summary</th>
            <th>Status</th>
            <th>Updated</th>
            <th>Chunks</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Chat with knowledge base</h2>
      <form id="chat-form">
        <input type="text" id="user-input" placeholder="Ask me something..." required>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    const kb = "{{ kb }}";
  </script>
  <!-- Chat widget -->
  <div class="chat-widget" id="chat-widget" aria-live="polite">
    <div class="chat-header">
      <div class="title">Assistant</div>
      <button class="chat-toggle" id="chat-toggle" title="Toggle chat">✕</button>
    </div>
    <div class="chat-body">
      <div class="chat-window" id="chat-window" role="log"></div>
      <div class="chat-input-wrap">
        <form id="chat-form" style="display:flex; width:100%;">
          <input id="user-input" class="chat-input" autocomplete="off" placeholder="Ask a question..." />
          <button type="submit" class="chat-send">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/js/knowledge_detail.js"></script>
</body>
</html>
