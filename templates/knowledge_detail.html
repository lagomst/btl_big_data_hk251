<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/knowledge_detail.css" />
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/knowledge-base">Back to List</a>
    </nav>
  </header>

  <main>
    <!-- Upload -->
    <section id="upload-section">
      <h2>Upload File</h2>
      <form id="uploadForm">
        <input type="file" id="file" name="file" required />
        <label><input type="checkbox" id="use_ocr" /> Use OCR</label>
        <button type="submit">Upload</button>
      </form>
      <div id="uploadStatus"></div>
    </section>

    <!-- Search -->
    <section id="search-section">
      <h2>Search Files</h2>
      <input id="query" placeholder="Search by prefix or filter..." />
      <button id="searchBtn">Search</button>
    </section>

    <!-- Files Table -->
    <section id="files-section">
      <h2>Files in Knowledge Base</h2>
      <table id="filesTable">
        <thead>
          <tr>
            <th>File Path</th>
            <th>Summary</th>
            <th>Status</th>
            <th>Updated</th>
            <th>Chunks</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const kb = "{{ kb }}";
  </script>
  <script src="/static/js/knowledge_detail.js"></script>
</body>
</html>
