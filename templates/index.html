<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/knowledge-base">Knowledge Base</a>>
    </nav>
  </header>
  <h1>🚀 Welcome to {{ title }}</h1>
  <p>Your API is running — UI served by FastAPI.</p>
  <script>const kb = "";</script>
  <!-- Chat widget -->
  <div class="chat-widget" id="chat-widget" aria-live="polite">
    <div class="chat-header">
      <div class="title">Assistant</div>
      <button class="chat-toggle" id="chat-toggle" title="Toggle chat">✕</button>
    </div>
    <div class="chat-body">
      <div class="chat-window" id="chat-window" role="log"></div>
      <div class="chat-input-wrap">
        <form id="chat-form" style="display:flex; width:100%;">
          <input id="user-input" class="chat-input" autocomplete="off" placeholder="Ask a question..." />
          <button type="submit" class="chat-send">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/js/knowledge_detail.js"></script>
</body>
</html>
